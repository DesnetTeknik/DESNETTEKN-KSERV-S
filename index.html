<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESNET - Teknik Servis Takip Sistemi</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, rgba(10, 15, 30, 0.92), rgba(15, 23, 42, 0.88)), 
                        url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #f1f5f9;
            min-height: 100vh;
        }

        /* Üst Header Barı */
        header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Sol Üst Büyük Logo Alanı */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-container img {
            height: 90px; /* Logo dev boyuta getirildi */
            width: auto;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
            object-fit: contain;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .logo-text span {
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: 500;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-profile .role-badge {
            background: #0284c7;
            color: white;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Giriş Paneli Stili */
        .login-box {
            max-width: 420px;
            margin: 80px auto;
            background: rgba(30, 41, 59, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 24px;
            color: #38bdf8;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            outline: none;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            border-color: #38bdf8;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #0369a1;
        }

        /* Tablo Stilleri */
        .card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            margin-bottom: 24px;
        }

        .card-header {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(15, 23, 42, 0.6);
            padding: 12px 16px;
            font-size: 0.85rem;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-processing { background: rgba(234, 179, 8, 0.2); color: #fde047; }
        .status-completed { background: rgba(34, 197, 94, 0.2); color: #4ade80; }

        /* Gizleme Sınıfı */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Üst Header Barı -->
    <header>
        <div class="logo-container">
            <img src="Gemini_Generated_Image_5vou275vou275vou.jpg" alt="Desnet Barkod Teknolojileri Logo">
            <div class="logo-text">
                DESNET
                <span>Teknik Servis Portalı</span>
            </div>
        </div>

        <div id="userPanel" class="user-profile hidden">
            <i class="fa-solid fa-user-gear" style="color: #38bdf8;"></i>
            <span id="userName">Muhammed Şimşek</span>
            <span class="role-badge" id="userRole">Müdür / Yönetici</span>
        </div>
    </header>

    <!-- Giriş Paneli -->
    <div id="loginSection" class="login-box">
        <h2><i class="fa-solid fa-lock"></i> Sistem Girişi</h2>
        <form id="loginForm" onsubmit="loginUser(event)">
            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="usernameInput" placeholder="Kullanıcı adınızı girin" required>
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="passwordInput" placeholder="Şifrenizi girin" required>
            </div>
            <button type="submit" class="btn-login">Giriş Yap</button>
        </form>
    </div>

    <!-- Ana Panel İçeriği (Girişte açılır) -->
    <div id="dashboardSection" class="container hidden">
        <div class="card">
            <div class="card-header">
                <i class="fa-solid fa-barcode"></i> Servisteki Cihaz Durumları
            </div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Servis No</th>
                            <th>Müşteri</th>
                            <th>Cihaz Modeli</th>
                            <th>Seri No</th>
                            <th>Durum</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>#SRV-1024</td>
                            <td>ABC Lojistik</td>
                            <td>Zebra ZD230d Barkod Yazıcı</td>
                            <td>21349082</td>
                            <td><span class="status-badge status-processing">İşlemde</span></td>
                            <td><i class="fa-solid fa-pen-to-square" style="cursor:pointer; color:#38bdf8;"></i></td>
                        </tr>
                        <tr>
                            <td>#SRV-1025</td>
                            <td>Sürat Market</td>
                            <td>Honeywell CT40 El Terminali</td>
                            <td>89230192</td>
                            <td><span class="status-badge status-completed">Tamamlandı</span></td>
                            <td><i class="fa-solid fa-pen-to-square" style="cursor:pointer; color:#38bdf8;"></i></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function loginUser(e) {
            e.preventDefault();
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('userPanel').classList.remove('hidden');
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
