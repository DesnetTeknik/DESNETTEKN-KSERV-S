<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desnet Teknik Servis Takip</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK (v8 Web) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <header>
        <div class="logo">DESNET TEKNİK</div>
        <nav>
            <button type="button" id="btn-sorgula-sekme" class="active">Müşteri Sorgulama</button>
            <button type="button" id="btn-panel-sekme">Yönetici Paneli</button>
        </nav>
    </header>

    <div class="container">
        
        <!-- 1. MÜŞTERİ SORGULAMA SAYFASI -->
        <section id="sorgulama-sayfasi">
            <div class="card">
                <h2>Cihaz Durum Sorgulama</h2>
                <p>Cihazınızın durumunu öğrenmek için size verilen <strong>Takip Numarasını (Örn: DES-1234)</strong> giriniz.</p>
                <div class="form-group">
                    <input type="text" id="sorgu-kod" placeholder="Takip No Giriniz...">
                    <button type="button" id="btn-sorgula">Sorgula</button>
                </div>
                <div id="sorgu-sonuc" style="margin-top: 20px;"></div>
            </div>
        </section>

        <!-- 2. YÖNETİCİ PANELİ -->
        <section id="panel-sayfasi" style="display: none;">
            
            <!-- GİRİŞ EKRANI -->
            <div id="giris-ekrani" class="card">
                <h2>Yönetici Girişi</h2>
                <div class="form-group">
                    <input type="email" id="giris-kullanici" placeholder="E-posta Adresi">
                    <input type="password" id="giris-sifre" placeholder="Şifre">
                    <button type="button" id="btn-giris-yap">Giriş Yap</button>
                </div>
            </div>

            <!-- PANEL İÇERİĞİ -->
            <div id="panel-icerigi" style="display: none;">
                <div class="panel-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <span id="aktif-rol-bilgisi" style="font-weight:bold; color:#0056b3;"></span>
                    <button type="button" id="btn-cikis-yap" class="btn-sil">Çıkış Yap</button>
                </div>

                <!-- CİHAZ EKLEME FORMU -->
                <div class="card">
                    <h3>Yeni Cihaz Kaydı</h3>
                    <form onsubmit="return false;">
                        <div class="form-grid">
                            <input type="text" id="yeni-musteri" placeholder="Müşteri Adı Soyadı">
                            <input type="text" id="yeni-cihaz" placeholder="Cihaz Modeli (Örn: Zebra ZD230d)">
                            <input type="text" id="yeni-seri" placeholder="Seri Numarası">
                            <select id="yeni-durum">
                                <option value="İşlemde">İşlemde</option>
                                <option value="Parça Bekliyor">Parça Bekliyor</option>
                                <option value="Tamamlandı">Tamamlandı</option>
                                <option value="Teslim Edildi">Teslim Edildi</option>
                            </select>
                        </div>
                        <textarea id="yeni-aciklama" placeholder="Arıza / İşlem Açıklaması" rows="3" style="width:100%; margin-top:10px;"></textarea>
                        <button type="button" id="btn-cihaz-ekle" style="margin-top: 10px;">Cihazı Kaydet</button>
                    </form>
                </div>

                <!-- CİHAZ LİSTESİ -->
                <div class="card" style="margin-top: 20px;">
                    <h3>Servisteki Cihazlar</h3>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Takip No</th>
                                <th>Müşteri</th>
                                <th>Cihaz</th>
                                <th>Seri No</th>
                                <th>Durum</th>
                                <th>Açıklama</th>
                                <th>İşlemler</th>
                            </tr>
                        </thead>
                        <tbody id="cihaz-tablo-body">
                            <!-- Veriler JS ile buraya gelecek -->
                        </tbody>
                    </table>
                </div>

            </div>
        </section>

    </div>

    <script src="script.js?v=20"></script>
</body>
</html>
